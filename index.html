<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gelato Week 2026 Berlin — Checklist</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />
<style>
  :root {
    --bg: #fffaf3;
    --panel: #ffffff;
    --ink: #2a1d12;
    --muted: #7a6a59;
    --accent: #ff5c8a;
    --accent-ink: #ffffff;
    --done: #2e7d32;
    --done-bg: #e8f3ea;
    --border: #ecd9c2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  #app {
    display: grid;
    grid-template-columns: minmax(320px, 380px) 1fr;
    height: 100dvh;
  }
  #sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header .sub {
    color: var(--muted);
    font-size: 12px;
  }
  .progress {
    margin-top: 10px;
    background: #f4ead9;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #ff8aa8, #ff5c8a);
    width: 0%;
    transition: width .25s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .controls {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 8px;
  }
  .controls input, .controls select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button.linkish {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font: inherit;
    padding: 0;
    text-decoration: underline;
  }
  #list {
    overflow: auto;
    flex: 1;
    padding: 4px 0 24px;
  }
  .group-h {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 12px 16px 4px;
  }
  .item {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid #f4ead9;
    cursor: pointer;
    align-items: start;
  }
  .item:hover { background: #fff5e6; }
  .item.done { background: var(--done-bg); }
  .item.done .name { text-decoration: line-through; color: #4d6b51; }
  .item input[type=checkbox] {
    margin-top: 3px;
    accent-color: var(--done);
    width: 18px; height: 18px;
  }
  .name { font-weight: 600; }
  .addr, .flavor { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .flavor { color: #6a4e2e; font-style: italic; }
  #map { height: 100%; min-height: 0; }
  .leaflet-popup-content {
    font-family: inherit;
    margin: 10px 12px;
    min-width: 200px;
  }
  .leaflet-popup-content .pop-name { font-weight: 700; margin-bottom: 4px; }
  .leaflet-popup-content .pop-addr { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .leaflet-popup-content .pop-flavor { font-style: italic; margin-bottom: 8px; }
  .leaflet-popup-content button {
    background: var(--accent); color: var(--accent-ink);
    border: 0; padding: 6px 10px; border-radius: 6px;
    font: inherit; cursor: pointer;
  }
  .leaflet-popup-content button.done { background: var(--done); }
  .marker-pin {
    width: 26px; height: 26px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    display: grid; place-items: center;
  }
  .marker-pin > span {
    transform: rotate(45deg);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  /* mobile */
  @media (max-width: 760px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 50dvh 1fr;
    }
    #sidebar { order: 2; border-right: 0; border-top: 1px solid var(--border); }
    #map-wrap { order: 1; }
  }
  #map-wrap { position: relative; min-height: 0; }
  .legend {
    position: absolute; right: 10px; bottom: 10px; z-index: 500;
    background: rgba(255,255,255,.95);
    padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    font-size: 12px;
  }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    vertical-align: middle; margin-right: 6px;
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>🍦 Gelato Week 2026 Berlin</h1>
      <div class="sub">Checklist com mapa de todas as sorveterias participantes.</div>
      <div class="progress"><span id="progress-bar"></span></div>
      <div class="progress-label" id="progress-label">0 de 52 visitadas</div>
    </header>
    <div class="controls">
      <input id="search" type="search" placeholder="Buscar nome, endereço ou sabor…" />
      <div class="row">
        <select id="district-filter"><option value="">Todos os bairros</option></select>
        <select id="status-filter">
          <option value="all">Todas</option>
          <option value="todo">Faltam visitar</option>
          <option value="done">Já visitadas</option>
        </select>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
        <span><button class="linkish" id="reset">Limpar marcações</button></span>
        <span><a href="https://true-italian.com/gelato-week-2026-berlin/" target="_blank" rel="noopener" style="color:var(--accent);">fonte</a></span>
      </div>
    </div>
    <div id="list" role="list"></div>
  </aside>
  <div id="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <div><span class="dot" style="background:#ff5c8a"></span>Faltam visitar</div>
      <div><span class="dot" style="background:#2e7d32"></span>Visitadas</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
const STORAGE_KEY = "gelato-week-2026-visited";
const visited = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

let places = [];
let markers = new Map();
let map;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...visited]));
}

function pinIcon(done) {
  const color = done ? "#2e7d32" : "#ff5c8a";
  return L.divIcon({
    className: "",
    html: `<div class="marker-pin" style="background:${color}"><span>🍦</span></div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 26],
    popupAnchor: [0, -22],
  });
}

function popupHTML(p) {
  const done = visited.has(p.id);
  return `
    <div>
      <div class="pop-name">${escapeHTML(p.name)}</div>
      <div class="pop-addr">${escapeHTML(p.address)} · ${escapeHTML(p.district)}</div>
      <div class="pop-flavor">${escapeHTML(p.flavor)}</div>
      <button class="${done ? "done" : ""}" data-id="${p.id}">
        ${done ? "✓ Visitada — desmarcar" : "Marcar como visitada"}
      </button>
    </div>`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function toggle(id, opts = { fly: false }) {
  if (visited.has(id)) visited.delete(id);
  else visited.add(id);
  save();
  render();
  const m = markers.get(id);
  if (m) {
    m.setIcon(pinIcon(visited.has(id)));
    const p = places.find((x) => x.id === id);
    m.setPopupContent(popupHTML(p));
  }
}

function updateProgress() {
  const total = places.length;
  const done = places.filter((p) => visited.has(p.id)).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-label").textContent =
    `${done} de ${total} visitadas (${pct}%)`;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const dist = document.getElementById("district-filter").value;
  const status = document.getElementById("status-filter").value;
  const list = document.getElementById("list");
  list.innerHTML = "";

  const filtered = places.filter((p) => {
    if (dist && p.district !== dist) return false;
    if (status === "done" && !visited.has(p.id)) return false;
    if (status === "todo" && visited.has(p.id)) return false;
    if (q) {
      const hay = `${p.name} ${p.address} ${p.flavor} ${p.district}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // group by district
  const groups = new Map();
  for (const p of filtered) {
    if (!groups.has(p.district)) groups.set(p.district, []);
    groups.get(p.district).push(p);
  }
  for (const [district, items] of groups) {
    const h = document.createElement("div");
    h.className = "group-h";
    h.textContent = `${district} (${items.length})`;
    list.appendChild(h);
    for (const p of items) {
      const done = visited.has(p.id);
      const el = document.createElement("div");
      el.className = "item" + (done ? " done" : "");
      el.setAttribute("role", "listitem");
      el.innerHTML = `
        <input type="checkbox" ${done ? "checked" : ""} aria-label="Visitada" />
        <div>
          <div class="name">${escapeHTML(p.name)}</div>
          <div class="addr">${escapeHTML(p.address)}</div>
          <div class="flavor">${escapeHTML(p.flavor)}</div>
        </div>`;
      const cb = el.querySelector("input");
      cb.addEventListener("click", (e) => {
        e.stopPropagation();
        toggle(p.id);
      });
      el.addEventListener("click", () => {
        const m = markers.get(p.id);
        if (m && p.lat && p.lon) {
          map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), 15), { duration: 0.6 });
          m.openPopup();
        }
      });
      list.appendChild(el);
    }
  }

  // toggle marker visibility on map based on filter
  for (const p of places) {
    const m = markers.get(p.id);
    if (!m) continue;
    const visible = filtered.includes(p);
    if (visible && !map.hasLayer(m)) m.addTo(map);
    else if (!visible && map.hasLayer(m)) map.removeLayer(m);
  }

  updateProgress();
}

async function init() {
  const res = await fetch("data/places.geocoded.json");
  places = await res.json();
  places.sort((a, b) => a.district.localeCompare(b.district) || a.name.localeCompare(b.name));

  // populate district filter
  const districts = [...new Set(places.map((p) => p.district))].sort();
  const sel = document.getElementById("district-filter");
  for (const d of districts) {
    const o = document.createElement("option");
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  }

  // map
  map = L.map("map", { zoomControl: true }).setView([52.515, 13.41], 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  // markers
  const bounds = [];
  for (const p of places) {
    if (!p.lat || !p.lon) continue;
    const m = L.marker([p.lat, p.lon], { icon: pinIcon(visited.has(p.id)) })
      .bindPopup(popupHTML(p));
    m.on("popupopen", (e) => {
      const btn = e.popup.getElement().querySelector("button[data-id]");
      if (btn) btn.addEventListener("click", () => toggle(p.id));
    });
    m.addTo(map);
    markers.set(p.id, m);
    bounds.push([p.lat, p.lon]);
  }
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("district-filter").addEventListener("change", render);
  document.getElementById("status-filter").addEventListener("change", render);
  document.getElementById("reset").addEventListener("click", () => {
    if (!visited.size) return;
    if (!confirm("Limpar todas as sorveterias marcadas?")) return;
    visited.clear(); save(); render();
    for (const [id, m] of markers) {
      m.setIcon(pinIcon(false));
      const p = places.find((x) => x.id === id);
      m.setPopupContent(popupHTML(p));
    }
  });

  render();
}
init();
</script>
</body>
</html>
